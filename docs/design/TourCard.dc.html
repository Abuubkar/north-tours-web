<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
</helmet>
<article onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}" style="height:100%;display:flex;flex-direction:column;background:{{ cardBg }};transition:background .4s ease;font-family:'Geist',system-ui,sans-serif;color:#F1EEE8;-webkit-font-smoothing:antialiased;">
  <div style="position:relative;aspect-ratio:4 / 3;overflow:hidden;border-radius:8px;background:#10181C;">
    <div data-rise-fade="1" style="position:absolute;inset:0;">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,#151E24 0 10px,#10181C 10px 20px);transform:{{ imgTransform }};opacity:{{ imgOpacity }};transition:transform 1s cubic-bezier(.2,.7,.2,1);"></div>
      <div style="position:absolute;left:20px;right:20px;bottom:16px;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;line-height:1.5;letter-spacing:.02em;color:#B7BFC5;">PHOTO · {{ photo }}</div>
    </div>
    <sc-if value="{{ isUrgent }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:#0C1216;border:1px solid #D9B44A;color:#D9B44A;font-size:13px;font-weight:500;"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" style="display:block;flex:none;"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"></circle><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>{{ urgentLabel }}</div>
    </sc-if>
    <sc-if value="{{ isSold }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:16px;left:16px;display:flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:#0C1216;border:1px solid #5C6871;color:#F1EEE8;font-size:13px;font-weight:500;">Sold out</div>
    </sc-if>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;padding:24px;">
    <div style="font-size:13px;font-weight:500;letter-spacing:.01em;color:#B7BFC5;">{{ route }}</div>
    <h3 style="margin:10px 0 0;font-size:26px;line-height:1.08;font-weight:500;letter-spacing:-.025em;color:{{ titleColor }};text-wrap:balance;">{{ title }}</h3>
    <div style="margin:10px 0 24px;font-size:15px;line-height:1.4;color:#F1EEE8;">{{ dates }}</div>
    <div style="margin-top:auto;padding-top:20px;border-top:1px solid #253038;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;">
      <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;">
        <span style="font-size:13px;color:#8F9AA2;">from</span>
        <span style="white-space:nowrap;font-size:24px;line-height:1.1;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:{{ titleColor }};">PKR {{ price }}</span>
        <span style="font-size:13px;color:#8F9AA2;">per person</span>
      </div>
      <div style="flex:none;display:flex;align-items:center;gap:6px;font-size:14px;padding-bottom:2px;">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,0.8 10.2,5.6 15.4,6.1 11.5,9.6 12.6,14.8 8,12.1 3.4,14.8 4.5,9.6 0.6,6.1 5.8,5.6" fill="#D9B44A"></polygon></svg>
        <span style="font-weight:600;font-variant-numeric:tabular-nums;">{{ rating }}</span>
        <span style="color:#8F9AA2;">({{ reviews }})</span>
      </div>
    </div>
    <div style="margin-top:16px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:{{ seatsColor }};">
      <span style="width:7px;height:7px;border-radius:50%;background:{{ dotColor }};flex:none;"></span>{{ seatsText }}
    </div>
    <div style="padding-top:24px;display:flex;gap:8px;">
      <sc-if value="{{ notSold }}" hint-placeholder-val="{{ true }}">
        <a href="{{ href }}" style="flex:1;height:48px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:6px;border:1px solid #D9B44A;background:#D9B44A;color:#10161A;font-size:15px;font-weight:500;text-decoration:none;">View Trip <span style="display:inline-block;transform:{{ arrowShift }};transition:transform .3s ease;">→</span></a>
      </sc-if>
      <sc-if value="{{ isSold }}" hint-placeholder-val="{{ false }}">
        <a href="#waitlist" style="flex:1;height:48px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid #5C6871;background:transparent;color:#F1EEE8;font-size:15px;font-weight:500;text-decoration:none;">Join waitlist</a>
      </sc-if>
      <a href="#whatsapp" aria-label="Ask about {{ title }} on WhatsApp" style="flex:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid {{ waBorder }};transition:border-color .3s ease;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="display:block;color:#F1EEE8;"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"></path></svg></a>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:640},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hunza &amp; Skardu Grand&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;145,000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;route&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lahore → Hunza → Skardu&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dates&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12–20 May · 9 days, 8 nights&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;seatsLeft&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:11,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:40},&quot;totalSeats&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:16,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:40},&quot;rating&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4.9&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reviews&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;128&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;photo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Attabad Lake, turquoise water, boats at the jetty&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;urgent&quot;,&quot;soldout&quot;],&quot;default&quot;:&quot;open&quot;,&quot;tsType&quot;:&quot;'open'|'urgent'|'soldout'&quot;},&quot;forceHover&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { hover: false };
  renderVals() {
    const p = this.props;
    const status = p.status ?? 'open';
    const sold = status === 'soldout', urgent = status === 'urgent';
    const hover = !sold && (p.forceHover || this.state.hover);
    const seats = sold ? 0 : (p.seatsLeft ?? (urgent ? 3 : 11));
    const total = p.totalSeats ?? 16;
    return {
      title: p.title ?? 'Hunza & Skardu Grand',
      price: p.price ?? '145,000',
      route: p.route ?? 'Lahore → Hunza → Skardu',
      dates: p.dates ?? '12–20 May · 9 days, 8 nights',
      rating: p.rating ?? '4.9',
      reviews: p.reviews ?? '128',
      photo: p.photo ?? 'Attabad Lake, turquoise water, boats at the jetty',
      href: p.href ?? '#trip',
      isUrgent: urgent, isSold: sold, notSold: !sold,
      urgentLabel: `Only ${seats} seats left`,
      seatsText: sold ? `0 of ${total} seats · waitlist open` : `${seats} of ${total} seats left`,
      onEnter: () => this.setState({ hover: true }),
      onLeave: () => this.setState({ hover: false }),
      cardBg: hover ? '#121A1F' : '#0C1216',
      imgTransform: hover ? 'scale(1.045)' : 'scale(1)',
      imgOpacity: sold ? 0.4 : 1,
      titleColor: sold ? '#B7BFC5' : '#F1EEE8',
      arrowShift: hover ? 'translateX(4px)' : 'translateX(0)',
      waBorder: hover ? '#F1EEE8' : '#5C6871',
      dotColor: urgent ? '#D9B44A' : sold ? '#5C6871' : '#B7BFC5',
      seatsColor: urgent ? '#D9B44A' : '#B7BFC5'
    };
  }
}
</script>
</body>
</html>
